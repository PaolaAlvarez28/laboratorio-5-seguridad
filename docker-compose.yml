services:
  una-chat:
    build: .
    image: una-chat:local
    container_name: una-chat
    hostname: una-chat-docker
    ports:
      - "3000:3000"
    # credenciales de Sentry y Grafana Cloud desde el .env local (no se sube a GitHub)
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SENTRY_ENVIRONMENT: local
      # mismo entorno "local" de la parte 2; service.instance.id identifica las pruebas en Docker
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.instance.id=una-chat-docker
    restart: unless-stopped
